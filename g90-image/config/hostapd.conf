# DEPRECATED — hostapd is no longer used (digipi single-wlan0 pattern).
# Kept here for reference only. The bootstrap no longer writes this file.
# See Phase 1.5h (single-wlan0 NM profiles) and Phase 1.5i (dispatcher watchdog)
# in reticulumpi-bootstrap.sh for the current implementation.
#
# 2026-09-27: previous design used wlan1 (USB dongle) for hostapd AP.
# That pattern is removed. Do not re-enable without operator sign-off.

interface=wlan1
driver=nl80211
ssid=ReticulumPi
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=reticulumpi
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
ieee80211n=1
