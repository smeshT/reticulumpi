# ReticulumPi hostapd config — TEMPLATE, generated by reticulumpi-bootstrap.sh
# DO NOT edit this file. Phase 1.5 of the bootstrap script overwrites
# /etc/hostapd/hostapd.conf with the actual deployed config. This
# template just makes the values discoverable in the overlay repo.
#
# To change SSID, AP password, or country at build time, set env vars:
#   RETICULUMPI_SSID=YourSSID \
#   RETICULUMPI_AP_PASSWORD=*** \
#   RETICULUMPI_WIFI_COUNTRY=US \
#   bash reticulumpi-bootstrap.sh
#
# Or via Pi Imager customisation (the bootstrap script reads
# /boot/firstrun.sh and harvests hostname/password/country).
#
# Defaults (if neither env vars nor Pi Imager customisation are set):
#   ssid=ReticulumPi
#   wpa_passphrase=CHANGE_ME_BEFORE_FLASH  <-- WARNING printed at build
#   country_code=US

interface=wlan0
driver=nl80211
ssid=ReticulumPi
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=CHANGE_ME_BEFORE_FLASH
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
ieee80211n=1
