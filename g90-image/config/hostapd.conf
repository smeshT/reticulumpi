# ReticulumPi hostapd config — TEMPLATE, generated by reticulumpi-bootstrap.sh
# DO NOT edit this file. Phase 1.5 of the bootstrap script overwrites
# /etc/hostapd/hostapd.conf with the actual deployed config. This
# template just makes the values discoverable in the overlay repo.
#
# ===== Build-time env vars (highest priority) =====
# Set these on the bash command line:
#   RETICULUMPI_HOSTNAME=mybox \
#   RETICULUMPI_SSID=ReticulumPi \
#   RETICULUMPI_AP_PASSWORD=reticulumpi \
#   RETICULUMPI_WIFI_COUNTRY=US \
#   RETICULUMPI_PI_PASSWORD=reticulumpi \
#   RETICULUMPI_CLIENT_SSID=MyHomeWifi \
#   RETICULUMPI_CLIENT_PASSWORD=mysecret \
#   bash reticulumpi-bootstrap.sh
#
# ===== Two wifi networks =====
# 1. AP (ReticulumPi, broadcast by the Pi's onboard wifi, wlan0)
#    - Operator joins this with phone/laptop to configure the box
#    - SSID and password set via RETICULUMPI_SSID/_AP_PASSWORD
#
# 2. Client (your home wifi, joined by a USB wifi dongle, wlan1)
#    - Pi joins this so it has internet for ZeroTier, apt, etc.
#    - SSID and password set via RETICULUMPI_CLIENT_SSID/_PASSWORD
#    - Requires a USB wifi dongle plugged into the Pi
#    - Both fields are optional; skip if you don't have a dongle
#
# ===== Pi Imager customisation =====
# If you tick "Set hostname", "Set username and password", and
# "Configure wireless LAN" in Pi Imager's customisation dialog
# (the gear icon), those values land in /boot/firstrun.sh and
# the bootstrap script harvests them automatically. Env vars
# override Pi Imager values.
#
# ===== Defaults (if neither env vars nor Pi Imager are set) =====
#   hostname         = reticulumpi
#   AP SSID          = ReticulumPi
#   AP pwd           = reticulumpi  (change via wizard or post-flash)
#   country          = US
#   pi pwd           = reticulumpi  (change via passwd or post-flash)
#   client SSID/pwd  = unset (no client wifi on first boot)

interface=wlan0
driver=nl80211
ssid=ReticulumPi
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=reticulumpi
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
ieee80211n=1
