interface=wlan0
driver=nl80211
# Default AP SSID is the hostname. Users should rename
# during first boot (or via the overlay's bootstrap.sh).
ssid=g90digi
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
# CHANGE_ME before flashing. WiFi password minimum 8 chars,
# must match the value in reticulumhf-config.env below.
wpa_passphrase=CHANGE_ME
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
